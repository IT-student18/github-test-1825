Element.prototype.setAttributes = function(attrs) {
  for (let key in attrs) {
    this.setAttribute(key, attrs[key]);
  }
};

function rdint(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
CreateCirc();
function start() {
    a = [0, 0];
    af = [...a];
    b = [...a];
    d = 99999;
    gg.style.display = 'none';
    mark.style.display = 'none';
    out1.style.display = 'none';
    //anyCollision = false;
    intervalId[0] = setInterval(colDetect, 1);
    intervalId[1] = setInterval(fall, s[0]);
    intervalId[2] = setInterval(CreateCirc, s[2]);
    intervalId[4] = setInterval(moveCircs, s[1]);
    setPos();
    document.addEventListener('pointerup', () => {a[1] = -20;

    //setTimeout(gOver, 5000);

function setPos(){
    q.style.top = `${q.height.baseVal.value}px`;
    q.style.left = '100px';
}

function fall(){
    a[0] += a[1];
    if (a[1]<50) a[1] += g;
    q.style.top = `${a[0]}px`;
    //if (anyCollision) gOver();
    //console.log('worksdamnit');
}

function moveCircs(){
    Reds.forEach(element => {
    const wid1 = element.width.baseVal.value;
    const lef = parseFloat(getComputedStyle(element).left);
    element.style.left = `${lef - 3}px`;
    if (lef<= -wid1) element.style.left = `${vWid - wid1}px`;
  });
  //console.log('WorksButTheyDonMove');
}

function colDetect(){
    af = [parseFloat(q.style.left), parseFloat(q.style.top)]
    var anyCollision = false;
    //out1.innerHTML = '';
  //out1.innerHTML = `Page: (${a[0].toFixed(2)},${a[1].toFixed(2)}), d=${d}`;
  Reds.forEach(element => {
    var rad = element.querySelector('circle').r.baseVal.value;
    b = [parseFloat(element.style.left) + rad, parseFloat(element.style.top) + rad];
    d = dist(af,b);
    //element.querySelector('text').textContent = d.toFixed(2);
    const rsum = rad + q.querySelector('circle').r.baseVal.value;
    //out1.innerHTML += ' | ';
    if (d <= rsum) {
        anyCollision = true;
      //anyCollision = true;
      //out1.innerHTML += '!!!';
      //console.log(out1.innerHTML);
    } /*else {
      //out1.innerHTML += d.toFixed(2);
        
    }*/
    
    // Update blue circle to last red circle’s position or refine logic if needed
    /*mark.style.left = af[0] + 'px';
    mark.style.top = af[1] + 'px';*/
    //out1.innerHTML += ['FTS', d.toFixed(2), rsum].join(' | ') + '#';
  });

  // Change color once based on any collision
  if (anyCollision) {
    q.querySelector('circle').setAttribute('fill', 'yellow');
  } else {
    q.querySelector('circle').setAttribute('fill', 'green');
  }
}

function dist([x1,y1],[x2,y2]){
    return Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
}

function CreateCirc() {
    var clonedElement = document.getElementsByClassName('RedCirc')[0].cloneNode(true);
    clonedElement.style.position = 'absolute';
    var randSize = rdint(10, 300);
    clonedElement.setAttributes({
        'width': `${randSize}px`,
        'height': `${randSize}px`,
        'visibility': 'visible'
    });
    clonedElement.querySelector('circle').setAttributes({
        'cx': randSize/2,
        'cy': randSize/2,
        'r': (randSize/2)-1,
        'fill': `rgb(${rdint(0,255)},${rdint(0,255)},${rdint(0,255)})`
    });
    clonedElement.style.left = vWid
    clonedElement.style.top = `${rdint(0+randSize, vHei-randSize)}px`;
    Reds.push(clonedElement);
    document.body.appendChild(clonedElement);
}

function gOver() {
    Reds.forEach(element => element.remove());
    intervalId.forEach(id => id && clearInterval(id));
    document.getElementById('gover').style.display = 'block';
